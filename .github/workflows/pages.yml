name: פרסום ב-GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # מחירי הסניפים מתעדכנים כל בוקר (קבצי שקיפות המחירים מתפרסמים בלילה)
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: מחירים לפי סניף (קבצי שקיפות המחירים)
        continue-on-error: true
        timeout-minutes: 20
        run: python3 tools/branch_prices.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
